<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配速對照表產生器 Pace Table Generator</title>
  <!-- Tailwind CSS CDN 與 future.hoverOnlyWhenSupported 設定 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      future: {
        hoverOnlyWhenSupported: true,
      },
      theme: {
        extend: {},
      },
      plugins: [],
    }
  </script>
  <!-- 匯出圖片所需的 html2canvas 套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* 確保截圖時字體渲染無偏移 */
    .export-card {
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 md:p-8">
  <div class="max-w-4xl mx-auto space-y-4 md:space-y-6">
    
    <!-- 標頭區 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
      <div>
        <h1 class="text-xl md:text-3xl font-bold text-emerald-400">配速對照表產生器</h1>
        <p class="text-slate-400 text-xs md:text-sm mt-0.5">輸入 400m 秒數快速比較 1k 配速與各距離完賽時間</p>
      </div>
      
      <div class="flex items-center gap-2 self-start sm:self-auto">
        <button 
          id="exportBtn" 
          class="bg-slate-800 hover:bg-emerald-950/40 active:bg-emerald-950/40 text-slate-300 hover:text-emerald-400 active:text-emerald-400 border border-slate-700 hover:border-emerald-800/50 px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center gap-1.5 cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          匯出圖片
        </button>
        <button 
          id="resetBtn" 
          class="bg-slate-800 hover:bg-rose-950/40 active:bg-rose-950/40 text-slate-400 hover:text-rose-400 active:text-rose-400 border border-slate-700 hover:border-rose-800/50 px-3 py-1.5 rounded-lg text-xs md:text-sm transition flex items-center gap-1.5 cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          清除全部
        </button>
      </div>
    </div>

    <!-- 輸入控制區塊 -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 md:p-6 shadow-lg space-y-4">
      <form id="paceForm" class="flex flex-col sm:flex-row items-end gap-3">
        <div class="flex-1 w-full">
          <label for="secInput" class="block text-xs md:text-sm font-medium text-slate-300 mb-1.5">
            400m 單圈時間 (秒)
          </label>
          <div class="relative">
            <input 
              type="text" 
              inputmode="numeric" 
              pattern="[0-9]*" 
              id="secInput" 
              placeholder="例如：90" 
              required
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 md:px-4 md:py-3 text-emerald-400 font-mono text-base md:text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent placeholder-slate-600 transition"
            />
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs md:text-sm font-mono">秒</span>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-500 text-white font-semibold px-5 py-2.5 md:py-3 rounded-lg shadow-md transition flex items-center justify-center gap-1.5 text-sm md:text-base whitespace-nowrap cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 md:w-5 md:h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
          </svg>
          新增
        </button>
      </form>

      <!-- 常用練習區間快捷按鈕 -->
      <div class="pt-2 border-t border-slate-700/60">
        <div class="text-[11px] md:text-xs text-slate-400 mb-2">常用練習區間快捷鍵：</div>
        <div class="flex flex-wrap gap-1.5">
          <button type="button" class="quick-btn bg-slate-900 hover:bg-slate-700 active:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded transition font-mono cursor-pointer" data-sec="90">90s (3'45" /km)</button>
          <button type="button" class="quick-btn bg-slate-900 hover:bg-slate-700 active:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded transition font-mono cursor-pointer" data-sec="98">98s (4'05" /km)</button>
          <button type="button" class="quick-btn bg-slate-900 hover:bg-slate-700 active:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded transition font-mono cursor-pointer" data-sec="102">102s (4'15" /km)</button>
          <button type="button" class="quick-btn bg-slate-900 hover:bg-slate-700 active:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded transition font-mono cursor-pointer" data-sec="108">108s (4'30" /km)</button>
          <button type="button" class="quick-btn bg-slate-900 hover:bg-slate-700 active:bg-slate-700 border border-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded transition font-mono cursor-pointer" data-sec="120">120s (5'00" /km)</button>
        </div>
      </div>
    </div>

    <!-- 資料呈現區 -->
    <div id="exportTarget" class="bg-slate-900 p-2 md:p-4 rounded-xl space-y-3">
      <div id="cardContainer" class="space-y-3">
        <!-- 預設空白提示 -->
        <div id="emptyTip" class="bg-slate-800 border border-slate-700 rounded-xl p-8 text-center text-slate-500 text-sm">
          尚無配速資料，請輸入秒數或點擊快捷按鈕加入對照表
        </div>
      </div>
    </div>

  </div>

  <script>
    const paceForm = document.getElementById('paceForm');
    const secInput = document.getElementById('secInput');
    const cardContainer = document.getElementById('cardContainer');
    const emptyTip = document.getElementById('emptyTip');
    const resetBtn = document.getElementById('resetBtn');
    const exportBtn = document.getElementById('exportBtn');

    const STORAGE_KEY = 'pace_calculator_data';
    let paceRecords = [];

    init();

    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          paceRecords = JSON.parse(saved);
          render();
        } catch (e) {
          paceRecords = [];
        }
      }

      document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const sec = parseFloat(btn.dataset.sec);
          if (sec > 0) {
            addRecord(sec);
          }
        });
      });
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = Math.round(totalSeconds % 60);

      if (hrs > 0) {
        return `${hrs}h ${mins.toString().padStart(2, '0')}m ${secs.toString().padStart(2, '0')}s`;
      }
      return `${mins}分 ${secs.toString().padStart(2, '0')}秒`;
    }

    function formatPace(secPerKm) {
      const mins = Math.floor(secPerKm / 60);
      const secs = Math.round(secPerKm % 60);
      return `${mins}'${secs.toString().padStart(2, '0')}"`;
    }

    function addRecord(totalLapSeconds) {
      if (isNaN(totalLapSeconds) || totalLapSeconds <= 0) return;

      paceRecords.unshift({
        id: Date.now(),
        lapSeconds: totalLapSeconds
      });

      saveAndRender();
    }

    paceForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const totalSeconds = parseFloat(secInput.value);
      if (isNaN(totalSeconds) || totalSeconds <= 0) return;

      addRecord(totalSeconds);

      secInput.value = '';
      secInput.focus();
    });

    function deleteRecord(id) {
      paceRecords = paceRecords.filter(r => r.id !== id);
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(paceRecords));
      render();
    }

    function render() {
      if (paceRecords.length === 0) {
        emptyTip.style.display = 'block';
        cardContainer.innerHTML = '';
        cardContainer.appendChild(emptyTip);
        return;
      }

      emptyTip.style.display = 'none';
      cardContainer.innerHTML = '';

      paceRecords.forEach((record, index) => {
        const lapSeconds = record.lapSeconds;
        const secPerKm = lapSeconds * 2.5;
        const sec5k = secPerKm * 5;
        const sec10k = secPerKm * 10;
        const secHalf = secPerKm * 21.0975;
        const secFull = secPerKm * 42.195;

        const card = document.createElement('div');
        card.className = 'export-card bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-md space-y-3';
        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-700/60 pb-2.5">
            <div class="flex items-center gap-2">
              <span class="bg-slate-900 text-slate-400 font-mono text-xs px-2 py-0.5 rounded border border-slate-700">#${paceRecords.length - index}</span>
              <span class="text-slate-300 text-sm">400m: <strong class="text-slate-100 font-mono">${lapSeconds}s</strong></span>
            </div>
            <button type="button" class="delete-btn text-slate-500 hover:text-rose-400 active:text-rose-400 p-1 transition cursor-pointer" title="刪除此筆" data-id="${record.id}">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-1 font-mono text-sm">
            <div class="bg-slate-900/80 p-2.5 rounded-lg border border-emerald-500/30 col-span-2 sm:col-span-1 flex flex-col justify-center">
              <div class="text-[10px] text-slate-400 font-sans uppercase tracking-wider">1 km 配速</div>
              <div class="text-emerald-400 font-bold text-base mt-0.5">${formatPace(secPerKm)} <span class="text-xs font-normal">/km</span></div>
            </div>
            <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50 flex flex-col justify-center">
              <div class="text-[10px] text-slate-400 font-sans">5 km</div>
              <div class="text-slate-200 text-sm mt-0.5">${formatTime(sec5k)}</div>
            </div>
            <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50 flex flex-col justify-center">
              <div class="text-[10px] text-slate-400 font-sans">10 km</div>
              <div class="text-slate-200 text-sm mt-0.5">${formatTime(sec10k)}</div>
            </div>
            <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50 flex flex-col justify-center">
              <div class="text-[10px] text-slate-400 font-sans">半馬 (21.1k)</div>
              <div class="text-slate-200 text-sm mt-0.5">${formatTime(secHalf)}</div>
            </div>
            <div class="bg-slate-900/50 p-2.5 rounded-lg border border-slate-700/50 flex flex-col justify-center">
              <div class="text-[10px] text-slate-400 font-sans">全馬 (42.2k)</div>
              <div class="text-slate-200 text-sm mt-0.5">${formatTime(secFull)}</div>
            </div>
          </div>
        `;

        card.querySelector('.delete-btn').addEventListener('click', (e) => {
          const id = Number(e.currentTarget.dataset.id);
          deleteRecord(id);
        });

        cardContainer.appendChild(card);
      });
    }

    resetBtn.addEventListener('click', () => {
      if (paceRecords.length === 0) return;
      if (confirm('確定要清除所有計算紀錄嗎？')) {
        paceRecords = [];
        saveAndRender();
      }
    });

    // 完美無跑版截圖邏輯
    exportBtn.addEventListener('click', () => {
      if (paceRecords.length === 0) {
        alert('請先新增至少一筆配速資料再匯出！');
        return;
      }

      exportBtn.innerText = '產生圖片中...';
      exportBtn.disabled = true;

      const target = document.getElementById('exportTarget');
      
      // 複製一份離線 DOM 用於專門渲染截圖
      const clone = target.cloneNode(true);
      
      // 移除離線 DOM 中的刪除按鈕，避免按鈕出現在圖片中
      clone.querySelectorAll('.delete-btn').forEach(btn => btn.remove());
      
      // 在頂部加上精美標題與產生時間
      const header = document.createElement('div');
      header.className = 'flex items-center justify-between pb-3 mb-2 border-b border-slate-800';
      header.innerHTML = `
        <div class="text-emerald-400 font-bold text-lg">🏃 跑步配速對照表</div>
        <div class="text-slate-500 text-xs">${new Date().toISOString().slice(0, 10)}</div>
      `;
      clone.insertBefore(header, clone.firstChild);

      // 設置絕對定位容器，確保在背景繪製時不受畫面滾動或尺寸縮放影響
      const container = document.createElement('div');
      container.style.position = 'absolute';
      container.style.left = '-9999px';
      container.style.top = '-9999px';
      container.style.width = '700px'; // 鎖定完美輸出寬度
      container.style.backgroundColor = '#0f172a';
      container.style.padding = '20px';
      container.style.borderRadius = '12px';
      container.appendChild(clone);
      document.body.appendChild(container);

      html2canvas(clone, {
        backgroundColor: '#0f172a',
        scale: 2,
        useCORS: true,
        logging: false
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `pace-table-${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        document.body.removeChild(container);

        exportBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg> 匯出圖片`;
        exportBtn.disabled = false;
      }).catch(err => {
        if (container.parentNode) document.body.removeChild(container);
        alert('匯出失敗，請重試');
        exportBtn.innerText = '匯出圖片';
        exportBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
